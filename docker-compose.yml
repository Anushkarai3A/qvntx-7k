name: windsight

services:
  backend:
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CACHE_DIR: /app/data/cache
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - windsight-cache:/app/data/cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  windsight-cache:
